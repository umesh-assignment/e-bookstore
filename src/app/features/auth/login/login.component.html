<main class="auth-page" id="main-content">
  <div class="auth-card">

    <!-- Logo / Brand -->
    <a class="auth-card__brand" routerLink="/" aria-label="Back to e-Bookstore home">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>e-Bookstore</span>
    </a>

    <h1 class="auth-card__title">Welcome back</h1>
    <p class="auth-card__sub">Sign in to your account</p>

    <!-- Demo credentials hint -->
    <div class="auth-card__demo" role="note">
      <strong>Demo account:</strong> demo&#64;ebookstore.com / Demo1234!
    </div>

    <!-- Error message -->
    @if (error()) {
      <div class="auth-card__error" role="alert" aria-live="assertive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        {{ error() }}
      </div>
    }

    <form class="auth-form" (ngSubmit)="onSubmit()" novalidate aria-label="Login form">

      <!-- Email -->
      <div class="auth-form__field">
        <label class="auth-form__label" for="login-email">Email address</label>
        <input
          id="login-email"
          class="auth-form__input"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
          aria-required="true" />
      </div>

      <!-- Password -->
      <div class="auth-form__field">
        <div class="auth-form__label-row">
          <label class="auth-form__label" for="login-password">Password</label>
          <a class="auth-form__forgot" routerLink="/register" tabindex="-1">Forgot password?</a>
        </div>
        <div class="auth-form__pass-wrap">
          <input
            id="login-password"
            class="auth-form__input"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            aria-required="true" />
          <button
            class="auth-form__toggle-pass"
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            {{ showPassword() ? '🙈' : '👁' }}
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button
        class="btn btn--primary auth-form__submit"
        type="submit"
        [disabled]="isLoading()"
        aria-label="Sign in">
        @if (isLoading()) {
          <span class="auth-form__spinner" aria-hidden="true"></span>
          Signing in…
        } @else {
          Sign in
        }
      </button>

    </form>

    <p class="auth-card__switch">
      Don't have an account?
      <a routerLink="/register">Create one free</a>
    </p>

  </div>
</main>
