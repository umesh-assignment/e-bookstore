<article
  class="book-card"
  [class.book-card--compact]="compact()"
  [class.book-card--out-of-stock]="!book().inStock"
>
  <!-- Clickable cover → book detail -->
  <a
    class="book-card__cover-link"
    [routerLink]="['/product', book().id]"
    [attr.aria-label]="'View details for ' + book().title"
    tabindex="0"
  >
    <!-- Cover image -->
    @if (!imageError()) {
      <img
        class="book-card__cover"
        [src]="book().coverUrl"
        [alt]="book().title + ' cover'"
        loading="lazy"
        (error)="onImageError()"
      />
    } @else {
      <div class="book-card__cover-fallback" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
             stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
    }

    <!-- Discount badge -->
    @if (discountPct() > 0) {
      <span class="book-card__discount-badge" aria-label="{{ discountPct() }}% off">
        -{{ discountPct() }}%
      </span>
    }

    <!-- Out-of-stock overlay -->
    @if (!book().inStock) {
      <div class="book-card__oos-overlay" aria-hidden="true">
        <span>Out of Stock</span>
      </div>
    }
  </a>

  <!-- Wishlist toggle -->
  <button
    class="book-card__wishlist-btn"
    type="button"
    [class.book-card__wishlist-btn--active]="inWishlist()"
    [attr.aria-label]="inWishlist() ? 'Remove from wishlist' : 'Add to wishlist'"
    [attr.aria-pressed]="inWishlist()"
    (click)="toggleWishlist($event)"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
  </button>

  <!-- Card body -->
  <div class="book-card__body">

    <!-- Genre chip -->
    <span class="book-card__genre">{{ book().genre }}</span>

    <!-- Title + author -->
    <a class="book-card__title-link"
       [routerLink]="['/product', book().id]"
       [attr.aria-label]="book().title">
      <h3 class="book-card__title">{{ book().title }}</h3>
    </a>
    <p class="book-card__author">{{ book().author }}</p>

    <!-- Rating -->
    <app-star-rating
      [rating]="book().rating"
      [reviewCount]="book().reviewCount"
      size="sm"
    />

    <!-- Price row -->
    <div class="book-card__price-row">
      <div class="price price--sm">
        <span class="price__current">£{{ book().price.toFixed(2) }}</span>
        @if (book().originalPrice) {
          <span class="price__original">£{{ book().originalPrice!.toFixed(2) }}</span>
        }
      </div>

      <!-- Add to basket -->
      <button
        class="book-card__add-btn btn btn--primary btn--sm"
        type="button"
        [disabled]="!book().inStock"
        [attr.aria-label]="'Add ' + book().title + ' to basket'"
        (click)="addToCart($event)"
      >
        @if (inCart()) {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        }
        {{ inCart() ? 'Added' : 'Add' }}
      </button>
    </div>

  </div>
</article>
